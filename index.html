.panel{position:absolute;left:50%;transform:translateX(-50%);top:70.5%;width:58%;
  padding:.9cqw 2cqw .9cqw;border-radius:1.2cqw;background:rgba(10,16,28,.72);backdrop-filter:blur(6px);
  border:.12cqw solid rgba(120,180,255,.35);box-shadow:0 .8cqw 3cqw rgba(0,0,0,.5);text-align:center}
.clock{display:flex;justify-content:center;gap:1.4cqw}
.unit{min-width:9.5cqw}
.num{font-weight:900;font-style:italic;font-size:5.2cqw;line-height:1;letter-spacing:.05em;
  background:linear-gradient(180deg,var(--blue1),var(--blue2));-webkit-background-clip:text;background-clip:text;color:transparent;
  font-variant-numeric:tabular-nums;filter:drop-shadow(0 .25cqw 0 rgba(0,0,0,.6))}
.lbl{font-weight:800;font-size:1cqw;letter-spacing:.25em;text-transform:uppercase;color:#dfe8f5;margin-top:.3cqw}
.sep{font-weight:900;font-size:4.2cqw;line-height:1.05;color:rgba(169,214,255,.55)}
.bar{margin:1cqw auto 0;height:.7cqw;width:92%;border-radius:1cqw;background:rgba(255,255,255,.12);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue2),var(--blue1));transition:width .8s}
.meta{display:flex;justify-content:space-between;width:92%;margin:.5cqw auto 0;font-size:.95cqw;font-weight:600;color:#b9c6d8;letter-spacing:.05em}
.done{display:none;font-weight:900;font-style:italic;font-size:3cqw;line-height:1.15;
  background:linear-gradient(180deg,#fff,var(--blue1));-webkit-background-clip:text;background-clip:text;color:transparent}
.ended .clock,.ended .bar,.ended .meta{display:none}.ended .done{display:block}
.snd{position:absolute;right:1.2cqw;top:1.2cqw;font:600 1.1cqw 'Exo 2',sans-serif;color:#fff;background:rgba(10,16,28,.65);
  border:.1cqw solid rgba(120,180,255,.4);border-radius:3cqw;padding:.5cqw 1.1cqw;cursor:pointer}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (max-aspect-ratio:1/1){
  body{align-items:flex-start;padding-top:12vh}
  .wrap{width:100vw}
  .stage{width:100vw}
  .panel{position:relative;left:auto;transform:none;top:auto;width:94vw;margin:4vw auto;padding:4vw 3vw;border-radius:4vw}
  .num{font-size:12vw}.lbl{font-size:2.6vw}.sep{font-size:9vw}.unit{min-width:17vw}.clock{gap:1.5vw}
  .bar{height:1.6vw;margin-top:3vw}.meta{font-size:2.8vw;margin-top:1.5vw}.done{font-size:6.5vw}
  .snd{font-size:3vw;padding:1.5vw 3vw;right:3vw;top:3vw}
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7fb;--cd:#fff;--tx:#14202e;--mu:#5b6b7d;--bd:#d3dde8;--hd:#0f3a63;--ac:#2a7fd4;--lk:#1b5fa8;--sd:#e9f0f7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c141d;--cd:#121e2b;--tx:#e4ecf4;--mu:#93a4b6;--bd:#243546;--hd:#0a2742;--ac:#4a90ff;--lk:#7db6ff;--sd:#0f1a26}}
:root[data-theme="dark"]{--bg:#0c141d;--cd:#121e2b;--tx:#e4ecf4;--mu:#93a4b6;--bd:#243546;--hd:#0a2742;--ac:#4a90ff;--lk:#7db6ff;--sd:#0f1a26}
#wiki{display:none}
.wm,.wm body{height:auto;min-height:100%;background:var(--bg);color:var(--tx)}
.wm body{display:block}
.wm .blur,.wm .wrap{display:none}
.wm #wiki{display:block}
.wm body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hd)}
.wh{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:var(--hd);color:#fff}
.wh a{color:#fff;text-decoration:none}
.logo{font-weight:900;font-style:italic;font-size:1.25rem}
#q{flex:1;min-width:140px;max-width:420px;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font:inherit}
#q::placeholder{color:#cfe0f3}
.wl{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;max-width:1100px;margin:0 auto;padding:18px}
.side{background:var(--sd);border:1px solid var(--bd);border-radius:10px;padding:12px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.side h3{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:10px 0 4px}
.side a{display:block;padding:4px 6px;border-radius:6px;color:var(--lk);text-decoration:none}
.side a:hover{background:var(--bd)}
main{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:18px 22px;min-width:0}
main h1{font-size:1.8rem;border-bottom:2px solid var(--ac);padding-bottom:6px;margin-bottom:14px}
main h2{font-size:1.2rem;margin:18px 0 6px}
main a{color:var(--lk)}
.mu{color:var(--mu)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
.th{width:44px;height:44px;object-fit:cover;border-radius:6px}
.ph{display:flex;align-items:center;justify-content:center;background:var(--sd);border:1px dashed var(--bd);color:var(--mu)}
.im{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;margin-bottom:8px}
.im.ph{font-size:3rem}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:800;color:#fff;background:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.cards a{display:block;padding:12px;border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:8px;background:var(--sd);text-decoration:none;color:var(--tx);font-weight:800}
.eb{display:flex;gap:20px;flex-direction:row-reverse;align-items:flex-start;flex-wrap:wrap}
.ib{width:240px;max-width:100%;border:1px solid var(--bd);border-radius:10px;background:var(--sd);padding:12px}
.ib dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-top:8px}
.tx{flex:1;min-width:240px;line-height:1.6}.tx p{margin-bottom:10px}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:18px}
.wt th,.wt td{border:1px solid var(--bd)}
.wt th{background:var(--sd)}
.wt th.sr{cursor:pointer;user-select:none;white-space:nowrap}
.wt tbody tr:hover{background:var(--sd)}
.az{columns:180px;column-gap:18px}
.az>div{break-inside:avoid;margin-bottom:12px}
.az h3{border-bottom:1px solid var(--bd);margin-bottom:4px}
.az ul{list-style:none}
.ed label{display:block;margin:10px 0;font-weight:700}
.ed input,.ed textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-weight:400}
.ed button{padding:8px 18px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:800;cursor:pointer}
.ed .dng{background:#c0392b}
#f-prev .im{max-width:200px}
.ed select{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-weight:400}
.bt{display:inline-block;padding:6px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}
.bt.dng{background:#c0392b}
.ab{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#toast{display:none;position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;padding:10px 18px;border-radius:10px;background:var(--hd);color:#fff;font-weight:700}
@media(max-width:720px){.wl{grid-template-columns:1fr}.side{position:static}}

.langsw{display:flex;gap:4px;margin-left:auto}
.langsw button{padding:5px 10px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:8px;font:inherit;font-weight:800;cursor:pointer}
.langsw .on{background:#fff;color:#0f3a63}
.cl{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:20;margin:0}
.cl button{background:rgba(0,0,0,.35)}
.wfab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);font-size:1.4rem;text-decoration:none}
.wlink{display:inline-block;margin-left:10px;padding:6px 14px;border-radius:999px;background:#fff;color:#111;text-decoration:none;font-weight:800}
.wm .cl,.wm .wfab{display:none}
.pw{position:relative;display:block}
.pw input{padding-right:44px}

let soundOn=false, actx=null, ended=false;
$('snd').onclick=()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();}catch(e){}
  soundOn=!soundOn;$('snd').textContent=soundOn?t('soundOff'):t('soundOn');};
function bell(){ if(!soundOn||!actx) return; const t=actx.currentTime;
  [523.25,1046.5,1568].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35/(i+1),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+2.5);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+2.6);});}

function tick(){
  const now=Date.now(), left=TARGET-now;
  if(left<=0){ if(!ended){ended=true;if(!wikiOpen){$('panel').classList.add('ended');bell();fireworks();setTimeout(()=>{if(!wikiOpen)showWiki();},9000);}} return; }
  const s=Math.floor(left/1000);
  $('d').textContent=pad(Math.floor(s/86400));$('h').textContent=pad(Math.floor(s%86400/3600));
  $('m').textContent=pad(Math.floor(s%3600/60));$('s').textContent=pad(s%60);
  const p=Math.min(100,Math.max(0,(now-START)/(TARGET-START)*100));
  $('fill').style.width=p+'%';$('pct').textContent=p.toFixed(1)+'%';
}

function ghDetect(){
 if(WIKI_REPO)return WIKI_REPO;
 const h=location.hostname;
 if(h.endsWith('.github.io')){const r=location.pathname.split('/')[1];return h.split('.')[0]+'/'+(r||h);}
 return '';
}
const b64e=s=>{const a=new TextEncoder().encode(s);let x='';for(let i=0;i<a.length;i+=8192)x+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(x);};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const L2=(o,n)=>({de:String(o&&o.de||'').trim().slice(0,n),en:String(o&&o.en||'').trim().slice(0,n)});
const ghPath=f=>`/repos/${GH.repo}/contents/${f}`;
const ghBr=()=>GH.branch?{branch:GH.branch}:{};
async function ghf(m,url,body,tok){
 const r=await fetch('https://api.github.com'+url,{method:m,headers:{accept:'application/vnd.github+json','content-type':'application/json',...(tok?{authorization:'Bearer '+tok}:{})},body:body?JSON.stringify(body):undefined});
 let d={};try{d=await r.json()}catch(e){}
 if(!r.ok){const k={401:'ghE401',403:'ghE403',404:'ghE404',409:'ghE409',422:'ghE409'}[r.status];const e=new Error(k?t(k):(d.message||'GitHub '+r.status));e.status=r.status;throw e;}
 return d;
}
async function ghRead(){
 const f=await ghf('GET',ghPath('data.json')+'?'+(GH.branch?'ref='+GH.branch+'&':'')+'t='+Date.now(),null,ghTok());
 return {d:JSON.parse(b64d(f.content)),sha:f.sha};
}
async function ghWrite(d,sha,msg){
 await ghf('PUT',ghPath('data.json'),{message:msg,content:b64e(JSON.stringify(d,null,1)),sha,...ghBr()},ghTok());
 toast(t('ghLive'));
}
async function ghVerify(tok){
 const rp=await ghf('GET','/repos/'+GH.repo,null,tok);
 if(!rp.permissions||!rp.permissions.push)throw new Error(t('ghNoWrite'));
 const u=await ghf('GET','/user',null,tok);
 GH.branch=rp.default_branch;
 return {user:u.login,role:rp.permissions.admin?'owner':'editor'};
}
async function ghEntry(e){
 e=e||{};const id=String(e.id||'');
 if(!/^[a-z0-9-]{1,60}$/.test(id))throw new Error('ID');
 const name=L2(e.name,80),text=L2(e.text,5000);
 if(!name.de||!name.en||!text.de||!text.en)throw new Error(t('bothLangs'));
 const {d,sha}=await ghRead();
 if(!d.cats.some(c=>c.id===e.cat))throw new Error(t('badCat'));
 const old=d.entries.find(x=>x.id===id);
 const o={id,name,text,cat:e.cat,image:old?old.image:'',added:old?old.added:new Date().toISOString().slice(0,10)};
 let shown=null;
 if(e.imageData){
  const mm=/^data:image\/(png|jpeg|webp|gif);base64,([A-Za-z0-9+/=]+)$/.exec(e.imageData);
  if(!mm||e.imageData.length>800000)throw new Error(t('badImg'));
  const f='img/'+id+'.'+(mm[1]==='jpeg'?'jpg':mm[1]);
  let fsha;try{fsha=(await ghf('GET',ghPath(f)+(GH.branch?'?ref='+GH.branch:''),null,ghTok())).sha;}catch(x){if(x.status!==404)throw x;}
  await ghf('PUT',ghPath(f),{message:'Bild: '+id,content:mm[2],...(fsha?{sha:fsha}:{}),...ghBr()},ghTok());
  o.image=f+'?v='+Date.now();shown=e.imageData;   // Bild sofort lokal zeigen, bis GitHub Pages neu gebaut hat
 }
 if(old)d.entries[d.entries.indexOf(old)]=o;else d.entries.push(o);
 await ghWrite(d,sha,'Eintrag: '+name.en);
 return {entry:shown?{...o,image:shown}:o};
}
async function ghDel(id){
 const {d,sha}=await ghRead(),old=d.entries.find(x=>x.id===id);
 d.entries=d.entries.filter(x=>x.id!==id);
 await ghWrite(d,sha,'Eintrag gelöscht: '+id);
 if(old&&old.image&&!old.image.startsWith('data:')){const f=old.image.split('?')[0];try{const x=await ghf('GET',ghPath(f)+(GH.branch?'?ref='+GH.branch:''),null,ghTok());await ghf('DELETE',ghPath(f),{message:'Bild gelöscht: '+id,sha:x.sha,...ghBr()},ghTok());}catch(x){}}
 return {ok:true};
}
async function ghCats(c){
 if(!Array.isArray(c)||c.length>50)throw new Error('?');
 const {d,sha}=await ghRead(),used=new Set(),out=[];
 for(const x of c){
  const n=L2(x,40);if(!n.de||!n.en)throw new Error(t('catBoth'));
  let id=typeof x.id==='string'&&d.cats.some(k=>k.id===x.id)?x.id:'';
  if(!id){const b=csl(n.en).slice(0,40),base=b==='x'?'cat':b;id=base;let i=2;while(used.has(id)||d.cats.some(k=>k.id===id))id=base+'-'+i++;}
  used.add(id);out.push({id,...n});
 }
 const ids=new Set(out.map(k=>k.id));
 if(d.entries.some(e=>!ids.has(e.cat)))throw new Error(t('catInUse'));
 d.cats=out;await ghWrite(d,sha,'Kategorien');return {cats:out};
}
async function ghApi0(m,p,b){
 const [k,id]=p.split('/');
 if(k==='data'){if(ghTok()){try{return (await ghRead()).d;}catch(e){}}const r=await fetch('data.json?t='+Date.now());if(!r.ok)throw new Error('data.json '+r.status);return r.json();}
 if(k==='me'){const x=ghTok();if(!x)throw new Error('401');return ghVerify(x);}
 if(k==='login'){const x=String(b.token||'').trim();const v=await ghVerify(x);ghSet(x);return v;}
 if(k==='logout'){ghSet('');return {ok:true};}
 if(k==='entry')return m==='DELETE'?ghDel(decodeURIComponent(id)):ghEntry(b.entry);
 if(k==='cats')return ghCats(b.cats);
 throw new Error('?');
}

async function api(m,p,b){

 const r=await fetch('/api/'+p,{method:m,headers:{'content-type':'application/json','x-requested-with':'wiki'},body:b?JSON.stringify(b):undefined});
 let d={};try{d=await r.json()}catch(e){}

 if(!r.ok)throw new Error(d.error&&typeof d.error==='object'?L(d.error):(d.error||'Error '+r.status));

function toast(m){let x=$('toast');if(!x){x=document.createElement('div');x.id='toast';document.body.appendChild(x);}x.textContent=m;x.style.display='block';clearTimeout(x._h);x._h=setTimeout(()=>{x.style.display='none';},5000);}
function shrink(f){return new Promise(res=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/webp',.85));};i.onerror=()=>res(null);i.src=u;});}
const az=()=>{const g={};ENTRIES.slice().sort((a,b)=>L(a.name).localeCompare(L(b.name),lang)).forEach(e=>{const n=L(e.name),Lt=(n[0]||'#').toUpperCase();(g[Lt]=g[Lt]||[]).push(e);});return `<h2>${t('all')} A–Z</h2><div class="az">`+Object.entries(g).map(([Lt,l])=>`<div><h3>${E(Lt)}</h3><ul>${l.map(e=>`<li><a href="#e-${E(e.id)}">${E(L(e.name))}</a></li>`).join('')}</ul></div>`).join('')+'</div>';};
function rows(l){
 if(!l.length)return `<p class="mu">${t('none')}</p>`;
 const v=e=>(S.k==='cat'?catName(e.cat):L(e.name)).toLowerCase();
 l=l.slice().sort((a,b)=>(v(a)>v(b)?1:v(a)<v(b)?-1:0)*S.d);
 const th=(k,x)=>`<th class="sr" data-k="${k}">${x}${S.k===k?(S.d>0?' ▲':' ▼'):' ⇅'}</th>`;
 return `<p class="mu">${l.length} ${t('entriesWord')} · ${t('sortHint')}</p><div class="tw"><table class="wt"><thead><tr><th>${t('img')}</th>${th('name',t('name'))}${th('cat',t('cat'))}</tr></thead><tbody>`+l.map(e=>`<tr><td>${thumb(e,'th')}</td><td><a href="#e-${E(e.id)}">${E(L(e.name))}</a></td><td>${E(catName(e.cat))}</td></tr>`).join('')+'</tbody></table></div>';
}
function entry(e){
 const c=catName(e.cat);
 return `<h1>${E(L(e.name))}</h1>${ME?`<p class="ab"><a class="bt" href="#edit-${E(e.id)}">✏️ ${t('editEntry')}</a> <button class="bt dng" data-del="${E(e.id)}">🗑️ ${t('delEntry')}</button></p>`:''}<div class="eb"><aside class="ib">${thumb(e,'im')}<dl><dt>${t('cat')}</dt><dd>${c?`<a href="#c-${E(e.cat)}">${E(c)}</a>`:'–'}</dd><dt>${t('added')}</dt><dd>${E(e.added||'–')}</dd></dl></aside><div class="tx">${E(L(e.text)).split('\n').map(p=>`<p>${p}</p>`).join('')}</div></div>`;
}
function home(){
 return `<h1>${t('welcome')} ${E(WIKI_NAME)}</h1><p>${t('introA')} <b>${ENTRIES.length}</b> ${t('entriesWord')}.</p>${CATS.length?`<h2>${t('cats')}</h2><div class="cards">${CATS.map(c=>`<a href="#c-${E(c.id)}" style="--c:var(--ac)">${E(L(c))}<br><span class="mu">${ENTRIES.filter(e=>e.cat===c.id).length} ${t('entriesWord')}</span></a>`).join('')}</div>`:''}<h2>${t('recent')}</h2>`+rows(ENTRIES.slice(-5).reverse());
}
const loginPage=()=>`<h1>${t('login')}</h1><div class="ed login"><label>${t('user')}<input id="l-user" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label>${t('pass')}<span class="pw"><input id="l-pass" type="password" autocomplete="current-password"><button type="button" id="l-eye" title="${t('show')}">👁</button></span></label><p><button id="l-go">${t('login')}</button> <span id="l-msg" class="mu"></span></p></div>`;
function bindLogin(){
 const go=async()=>{const b=$('l-go');b.disabled=true;$('l-msg').textContent='…';try{const d=await api('POST','login',{user:$('l-user').value,pass:$('l-pass').value});ME={user:d.user,role:d.role};location.hash='home';buildSide();route();}catch(e){$('l-msg').textContent=e.message;b.disabled=false;}};
 $('l-go').onclick=go;
 $('l-eye').onclick=()=>{const i=$('l-pass');i.type=i.type==='password'?'text':'password';};
 [$('l-user'),$('l-pass')].forEach(i=>{i.onkeydown=ev=>{if(ev.key==='Enter')go();};});
 $('l-user').focus();
}
const accountPage=()=>`<h1>${t('account')}</h1><p><b>${E(ME.user)}</b> (${t(owner()?'roleOwner':'roleEditor')})</p>`+((owner()||GH.on)?`<p class="mu">${t(GH.on?'ghHint':'ownerPassHint')}</p>`:`<h2>${t('change')}</h2><div class="ed"><label>${t('oldPass')}<input id="p-old" type="password" autocomplete="current-password"></label><label>${t('newPass')} (${t('min8')})<input id="p-new" type="password" autocomplete="new-password"></label><p><button id="p-go">${t('change')}</button> <span id="p-msg" class="mu"></span></p></div>`)+`<p><button class="bt dng" id="lo">${t('logout')}</button></p>`;
async function doLogout(){try{await api('POST','logout')}catch(e){}ME=null;location.hash='home';buildSide();route();}
function bindAccount(){
 $('lo').onclick=doLogout;
 if($('p-go'))$('p-go').onclick=async()=>{try{await api('POST','password',{old:$('p-old').value,pass:$('p-new').value});$('p-old').value=$('p-new').value='';$('p-msg').textContent=t('changed');}catch(e){$('p-msg').textContent=e.message;}};
}
async function accPage(){
 const m=$('main');
 try{
  const d=await api('GET','users');
  m.innerHTML=`<h1>${t('accounts')}</h1><p class="mu">${t('accIntro')}</p>${NOTE?`<p class="note">${E(NOTE)}</p>`:''}<div class="ed"><label>${t('newEditor')} – ${t('user')}<input id="a-user" autocomplete="off" autocapitalize="none"></label><label>${t('pass')} (${t('min8')})<input id="a-pass" autocomplete="off"></label><p><button class="bt" id="a-gen">${t('gen')}</button> <button id="a-add">${t('create')}</button> <span id="a-msg" class="mu"></span></p></div><h2>${t('editors')}</h2>`+(d.users.length?'<div class="tw"><table class="wt"><tbody>'+d.users.map(u=>`<tr><td><b>${E(u)}</b></td><td><input class="rp" data-u="${E(u)}" placeholder="${t('newPass')}" autocomplete="off"></td><td><button class="bt" data-rs="${E(u)}">${t('reset')}</button> <button class="bt dng" data-ud="${E(u)}">${t('del')}</button></td></tr>`).join('')+'</tbody></table></div>':`<p class="mu">${t('noEditors')}</p>`);
  const gen=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(12);crypto.getRandomValues(a);return [...a].map(x=>c[x%c.length]).join('');};
  $('a-gen').onclick=()=>{$('a-pass').value=gen();};
  $('a-add').onclick=async()=>{const u=$('a-user').value.trim().toLowerCase(),p=$('a-pass').value;try{await api('POST','users',{user:u,pass:p});NOTE=t('created')+': '+u+' / '+p;accPage();}catch(e){$('a-msg').textContent=e.message;}};
  m.querySelectorAll('[data-rs]').forEach(b=>{b.onclick=async()=>{const u=b.dataset.rs,i=m.querySelector('.rp[data-u="'+u+'"]');const p=i.value||gen();try{await api('PUT','users/'+encodeURIComponent(u),{pass:p});NOTE=t('resetDone')+': '+u+' / '+p;accPage();}catch(e){toast(e.message);}};});
  m.querySelectorAll('[data-ud]').forEach(b=>{b.onclick=async()=>{if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent=t('sure');return;}try{await api('DELETE','users/'+encodeURIComponent(b.dataset.ud));NOTE='';accPage();}catch(e){toast(e.message);}};});
 }catch(e){m.innerHTML=`<h1>${t('accounts')}</h1><p>${E(e.message)}</p>`;}
}
const catSel=v=>CATS.length?`<select id="f-cat">${CATS.map(c=>`<option value="${E(c.id)}"${c.id===v?' selected':''}>${E(L(c))}</option>`).join('')}</select>`:`<p class="mu">${t('noCatYet')} <a href="#kategorien">${t('manageCats')}</a></p>`;
function editor(id){
 const ex=ENTRIES.find(x=>x.id===id),e=ex||{name:{},text:{},image:''};
 const f=(k,lab,v,ta)=>ta?`<label>${lab}<textarea id="f-${k}" rows="6">${E(v||'')}</textarea></label>`:`<label>${lab}<input id="f-${k}" value="${E(v||'')}"></label>`;
 return `<h1>${ex?t('editEntry'):t('newEntry')}</h1><p class="mu">${t('bothLangs')}</p><div class="ed">${f('nd','Name (DE) *',e.name.de)}${f('ne','Name (EN) *',e.name.en)}<label>${t('cat')} *${catSel(e.cat)}</label>${f('td','Text (DE) *',e.text.de,1)}${f('te','Text (EN) *',e.text.en,1)}<label>${t('img')}<input id="f-img" type="file" accept="image/*"></label><div id="f-prev">${e.image?`<img class="im" src="${E(e.image)}" alt="">`:''}</div><p><button id="f-save">${t('save')}</button>${ex?` <button class="bt dng" data-del="${E(e.id)}">${t('del')}</button>`:''} <span id="f-msg" class="mu"></span></p></div>`;
}
function bindEd(id){
 const ex=ENTRIES.find(x=>x.id===id);let img=null;
 $('f-img').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const r=await shrink(f);if(r){img=r;$('f-prev').innerHTML=`<img class="im" src="${r}" alt="">`;}};
 $('f-save').onclick=async()=>{
  const v=k=>$('f-'+k)?$('f-'+k).value.trim():'',m=$('f-msg');
  const name={de:v('nd'),en:v('ne')},text={de:v('td'),en:v('te')},cat=v('cat');
  if(!name.de||!name.en||!text.de||!text.en||!cat){m.textContent=t('needAll');return;}
  m.textContent=t('saving');
  try{
   const r=await api('POST','entry',{entry:{id:ex?ex.id:slug(name.en),name,text,cat,imageData:img||''}});
   const i=ENTRIES.findIndex(x=>x.id===r.entry.id);if(i<0)ENTRIES.push(r.entry);else ENTRIES[i]=r.entry;
   location.hash='e-'+r.entry.id;route();
  }catch(e){m.textContent=e.message;}
 };
}
async function delEntry(b){
 if(!ME)return;
 if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent=t('sure');return;}
 try{await api('DELETE','entry/'+encodeURIComponent(b.dataset.del));ENTRIES=ENTRIES.filter(x=>x.id!==b.dataset.del);location.hash='home';route();}catch(e){toast(e.message);}
}
function catPage(){
 return `<h1>${t('manageCats')}</h1><div class="ed"><label>${t('newCat')} (DE) *<input id="c-de"></label><label>${t('newCat')} (EN) *<input id="c-en"></label><p><button id="c-add">${t('add')}</button> <span id="c-msg" class="mu"></span></p></div><h2>${t('existing')}</h2>`+(CATS.length?'<div class="tw"><table class="wt"><tbody>'+CATS.map(c=>{const n=ENTRIES.filter(e=>e.cat===c.id).length;return `<tr><td>${E(c.de)}</td><td>${E(c.en)}</td><td>${n} ${t('entriesWord')}</td><td>${n?`<span class="mu">${t('inUse')}</span>`:`<button class="bt dng" data-cd="${E(c.id)}">${t('del')}</button>`}</td></tr>`;}).join('')+'</tbody></table></div>':`<p class="mu">${t('noCats')}</p>`);
}
async function saveCats(l,msg){try{const r=await api('POST','cats',{cats:l});CATS=r.cats;route(1);}catch(e){if(msg)msg.textContent=e.message;else toast(e.message);}}
function bindCat(){
 $('c-add').onclick=()=>{const de=$('c-de').value.trim(),en=$('c-en').value.trim(),m=$('c-msg');if(!de||!en){m.textContent=t('needAll');return;}saveCats(CATS.concat({de,en}),m);};
 document.querySelectorAll('[data-cd]').forEach(b=>{b.onclick=()=>{if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent=t('sure');return;}saveCats(CATS.filter(c=>c.id!==b.dataset.cd));};});
}
function admUI(){
 const c=$('cats');if(c)c.innerHTML=CATS.length?`<h3>${t('cats')}</h3>`+CATS.map(x=>`<a href="#c-${E(x.id)}">${E(L(x))}</a>`).join(''):'';
 const d=$('adm');if(!d)return;
 d.onclick=ev=>{const x=ev.target.closest('[data-del]');if(x){ev.preventDefault();delEntry(x);}};
 if(!ME){d.innerHTML='';return;}
 const h=location.hash.slice(1),id=h.startsWith('e-')?h.slice(2):(h.startsWith('edit-')&&h!=='edit-new'?h.slice(5):'');
 d.innerHTML=`<h3>${t('edit')}</h3><a href="#edit-new">＋ ${t('newEntry')}</a><a href="#kategorien">🗂️ ${t('manageCats')}</a>`+(id?`<a href="#edit-${E(id)}">✏️ ${t('editEntry')}</a><a href="#" data-del="${E(id)}">🗑️ ${t('delEntry')}</a>`:`<span class="mu">${t('openEntry')}</span>`)+`<h3>${t('account')}</h3><a href="#account">👤 ${E(ME.user)} (${t(owner()?'roleOwner':'roleEditor')})</a>`+(owner()?`<a href="#accounts">👥 ${t('accounts')}</a>`:'')+`<a href="#" id="lo2">${t('logout')}</a>`;
 $('lo2').onclick=ev=>{ev.preventDefault();doLogout();};
}
function buildSide(){
 $('side').innerHTML=`<div class="langsw sl"><button data-l="de">DE</button><button data-l="en">EN</button></div><h3>${t('nav')}</h3><a href="#home">${t('home')}</a><a href="#all">${t('all')}</a><a href="#all" id="rnd">${t('random')}</a><div id="cats"></div><div id="adm"></div>`;
 $('rnd').onclick=ev=>{ev.preventDefault();if(ENTRIES.length)location.hash='e-'+ENTRIES[Math.floor(Math.random()*ENTRIES.length)].id;};
 admUI();markLang();
}
function markLang(){document.querySelectorAll('.langsw button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));}
function chrome(){$('wn').textContent=WIKI_NAME;$('q').placeholder=t('search');$('ft').innerHTML='© '+E(WIKI_NAME)+(STATIC?'':' · <a href="#login">'+t('footLogin')+'</a>');}
function route(keep){
 if(!wikiOpen)return;
 const h=location.hash.slice(1)||'home';let ti=WIKI_NAME,html;
 const deny=`<h1>${t('noaccess')}</h1><p><a href="#login">${t('login')}</a></p>`;
 if(!LOADED)html=`<p class="mu">${t('loading')}</p>`;
 else if(h==='all'){const q=Q.toLowerCase();ti=t('all');html=`<h1>${t('all')}</h1>`+rows(ENTRIES.filter(e=>!q||[e.name.de,e.name.en,e.text.de,e.text.en].join(' ').toLowerCase().includes(q)))+(q?'':az());}
 else if(h.startsWith('c-')){const c=catOf(h.slice(2));ti=c?L(c):t('nf');html=c?`<h1>${t('cat')}: ${E(L(c))}</h1>`+rows(ENTRIES.filter(e=>e.cat===c.id)):`<h1>${t('nf')}</h1>`;}
 else if(h==='login'||h==='account')html=STATIC?`<p class="mu">${t('static')}</p>`:(ME?accountPage():(GH.on?ghLoginPage():loginPage()));
 else if(h==='kategorien')html=ME?catPage():deny;
 else if(h==='accounts')html=owner()?`<h1>${t('accounts')}</h1><p class="mu">${t('loading')}</p>`:deny;
 else if(h.startsWith('edit-'))html=ME?editor(h.slice(5)):deny;
 else if(h.startsWith('e-')){const e=ENTRIES.find(x=>x.id===h.slice(2));ti=e?L(e.name):t('nf');html=e?entry(e):`<h1>${t('nf')}</h1>`;}
 else html=home();
 $('main').innerHTML=html;
 if(LOADED){
  if((h==='login'||h==='account')&&!STATIC){if(ME)bindAccount();else if(GH.on)bindGhLogin();else bindLogin();}
  if(h==='kategorien'&&ME)bindCat();
  if(h==='accounts'&&owner()){if(GH.on)ghAccPage();else accPage();}
  if(h.startsWith('edit-')&&ME)bindEd(h.slice(5));
 }
 admUI();document.title=ti+' – '+WIKI_NAME;if(!keep)scrollTo(0,0);
}
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-t]').forEach(n=>{n.textContent=t(n.dataset.t);});
 $('snd').textContent=soundOn?t('soundOff'):t('soundOn');
 markLang();
 if(wikiOpen){chrome();buildSide();route(1);}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('.langsw [data-l]');if(!b)return;lang=b.dataset.l;try{localStorage.setItem('wikiLang',lang)}catch(e){}applyLang();});
async function init(){
 let d;
 try{d=await api('GET','data');}
 catch(e){
  const repo=ghDetect();
  try{
   if(repo){GH.on=true;GH.repo=repo;d=await ghApi('GET','data');}
   else{const r=await fetch('data.json');if(!r.ok)throw e;d=await r.json();STATIC=true;}
   chrome();
  }catch(e2){$('main').innerHTML='<p>Error: '+E(e2.message||e.message)+'</p>';return;}
 }
 CATS=d.cats||[];ENTRIES=d.entries||[];
 if(!STATIC){try{const m=await api('GET','me');ME={user:m.user,role:m.role};}catch(e){}}
 LOADED=true;buildSide();route(1);
}
function showWiki(){
 if(wikiOpen)return;wikiOpen=true;
 document.documentElement.classList.add('wm');
 chrome();
 $('q').oninput=ev=>{Q=ev.target.value;if(location.hash==='#all')route();else location.hash='all';};
 $('main').onclick=ev=>{const x=ev.target.closest('[data-del]');if(x){delEntry(x);return;}const th=ev.target.closest('th[data-k]');if(!th)return;const k=th.dataset.k;S=S.k===k?{k:k,d:-S.d}:{k:k,d:1};route(1);};
 buildSide();route();init();
}
addEventListener('hashchange',()=>{if(location.hash.length>1)showWiki();route();});
// Countdown bis 01.12.2026 17:00 Uhr; danach (oder über das 📖-Symbol / #home) die Wiki
if(location.hash.length>1||Date.now()>=TARGET)showWiki();
applyLang();

tick(); setInterval(tick,250);

function fireworks(){
  const c=$('fx'),x=c.getContext('2d');let P=[];
  const size=()=>{c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;};size();addEventListener('resize',size);
  function burst(){const cx=c.width*(.15+Math.random()*.7),cy=c.height*(.1+Math.random()*.4),hue=Math.random()<.5?210:45+Math.random()*320;
    for(let i=0;i<70;i++){const a=Math.random()*6.283,v=(1+Math.random()*3.5)*devicePixelRatio;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h:hue});}}
  setInterval(burst,700);burst();
  (function loop(){x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,0,c.width,c.height);
    x.globalCompositeOperation='lighter';
    P=P.filter(p=>(p.l-=.012)>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04*devicePixelRatio;p.vx*=.985;
      x.fillStyle=`hsla(${p.h},100%,65%,${p.l})`;x.beginPath();x.arc(p.x,p.y,2*devicePixelRatio,0,6.283);x.fill();});
    requestAnimationFrame(loop);})();
}
</script>
</body>
